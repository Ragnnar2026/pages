<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ShadowSpeak — English Shadowing Trainer</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0e14;--bg2:#12141c;--card:#181b25;--card-active:#1e2130;
  --text:#e4e2de;--text-muted:#7d7f8a;--border:#252836;
  --accent:#e8a838;--accent-dim:rgba(232,168,56,.12);
  --phrasal:#4ade80;--phrasal-dim:rgba(74,222,128,.1);
  --idiom:#f59e0b;--idiom-dim:rgba(245,158,11,.1);
  --danger:#ef4444;--danger-dim:rgba(239,68,68,.12);
  --success:#22c55e;--radius:12px;--radius-sm:8px;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.65;
  min-height:100vh;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(ellipse at 15% 50%,rgba(232,168,56,.025) 0%,transparent 55%),
                    radial-gradient(ellipse at 85% 15%,rgba(74,222,128,.015) 0%,transparent 50%);
}
.app{max-width:720px;margin:0 auto;padding:0 16px 80px}
/* HEADER */
header{padding:20px 0 12px;border-bottom:1px solid var(--border);margin-bottom:16px}
.header-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted)}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend-dot.g{background:var(--phrasal)}.legend-dot.y{background:var(--idiom)}
.legend-dot.b{background:var(--text);font-weight:700;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--bg)}
/* CONTROLES SUPERIORES */
.controls-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.level-tabs{display:flex;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border)}
.level-tab{padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;background:var(--card);
  color:var(--text-muted);border:none;transition:all .2s}
.level-tab:hover{color:var(--text)}
.level-tab.active{background:var(--accent);color:#0c0e14}
.ctrl-group{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.ctrl-group label{white-space:nowrap}
.ctrl-select{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;
  padding:6px 10px;font-size:12px;cursor:pointer;outline:none}
.ctrl-select:focus{border-color:var(--accent)}
/* STORY HEADER */
.story-header{margin-bottom:14px}
.story-title{font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:-.3px}
.story-actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:var(--radius-sm);
  border:1px solid var(--border);background:var(--card);color:var(--text);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.btn:hover{background:var(--card-active);border-color:#3a3d4a}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;pointer-events:none}
.btn-accent{background:var(--accent);color:#0c0e14;border-color:var(--accent)}
.btn-accent:hover{background:#d4972f;border-color:#d4972f}
.btn-danger{background:var(--danger-dim);color:var(--danger);border-color:rgba(239,68,68,.3)}
.btn-danger:hover{background:rgba(239,68,68,.2)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-muted)}
.btn-ghost:hover{color:var(--text);background:var(--card)}
.btn-sm{padding:7px 12px;font-size:12px}
/* PROGRESSO */
.progress-section{margin-bottom:16px}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px;color:var(--text-muted)}
.progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}
.progress-nav{display:flex;gap:8px;margin-top:8px}
/* SENTENCE CARD */
.sentence-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;margin-bottom:12px;transition:all .25s;position:relative;overflow:hidden}
.sentence-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--border);border-radius:4px 0 0 4px;transition:background .3s}
.sentence-card.active{border-color:rgba(232,168,56,.25);background:var(--card-active)}
.sentence-card.active::before{background:var(--accent)}
.sentence-card.recording{border-color:rgba(239,68,68,.35);box-shadow:0 0 20px rgba(239,68,68,.08)}
.sentence-card.recording::before{background:var(--danger);animation:pulse-bar 1s infinite}
.sentence-card.done::before{background:var(--success)}
.sentence-num{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.sentence-text{font-size:17px;line-height:1.8;margin-bottom:12px;color:var(--text)}
/* PHRASAL / IDIOM / STRESS */
.phrasal{color:var(--phrasal);background:var(--phrasal-dim);padding:2px 6px;border-radius:4px;
  cursor:pointer;font-weight:600;transition:background .15s}
.phrasal:hover{background:rgba(74,222,128,.2)}
.idiom{color:var(--idiom);background:var(--idiom-dim);padding:2px 6px;border-radius:4px;
  cursor:pointer;font-weight:600;transition:background .15s}
.idiom:hover{background:rgba(245,158,11,.2)}
.stress{font-weight:800;color:#fff}
/* TRADUÇÃO */
.translation{font-size:14px;color:var(--text-muted);padding:10px 14px;background:var(--bg2);
  border-radius:var(--radius-sm);margin-bottom:12px;border-left:3px solid var(--accent);
  display:none;line-height:1.6}
.translation.show{display:block;animation:fadeSlide .25s ease}
/* CONTROLES DO CARD */
.card-controls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.card-controls .btn{flex:1;min-width:0;justify-content:center;font-size:12px;padding:9px 8px}
/* YOUR TURN */
.your-turn{display:none;text-align:center;padding:16px;margin-bottom:10px;
  font-size:18px;font-weight:800;color:var(--accent);letter-spacing:1px;
  animation:fadeInUp .3s ease}
.your-turn.show{display:block}
/* RECORDING INDICATOR */
.rec-indicator{display:none;align-items:center;justify-content:center;gap:8px;padding:10px;
  margin-bottom:10px;background:var(--danger-dim);border-radius:var(--radius-sm);font-size:14px;font-weight:700;color:var(--danger)}
.rec-indicator.show{display:flex}
.rec-dot{width:12px;height:12px;background:var(--danger);border-radius:50%;animation:pulse-dot 1s infinite}
/* COMPARAÇÃO */
.comparison{display:none;margin-top:12px;gap:8px}
.comparison.show{display:grid;grid-template-columns:1fr 1fr;animation:fadeSlide .3s ease}
.compare-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:14px;text-align:center}
.compare-label{font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.compare-box .btn{width:100%;justify-content:center}
/* SHADOWING MODE BANNER */
.shadow-banner{display:none;align-items:center;justify-content:center;gap:10px;padding:12px 16px;
  margin-bottom:14px;background:linear-gradient(135deg,rgba(232,168,56,.12),rgba(74,222,128,.08));
  border:1px solid rgba(232,168,56,.25);border-radius:var(--radius);font-size:14px;font-weight:700;color:var(--accent)}
.shadow-banner.show{display:flex}
.shadow-pulse{width:10px;height:10px;background:var(--accent);border-radius:50%;animation:pulse-dot 1.2s infinite}
/* VOCABULÁRIO */
.vocab-section{margin-top:28px}
.vocab-title{font-size:18px;font-weight:700;margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.vocab-table{width:100%;border-collapse:collapse;font-size:13px}
.vocab-table th{text-align:left;padding:10px 8px;color:var(--text-muted);font-weight:600;
  border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.vocab-table td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.vocab-table tr:last-child td{border-bottom:none}
.vocab-expr{font-weight:700;color:var(--text)}
.vocab-type{font-size:11px;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap;display:inline-block}
.vocab-type.pv{background:var(--phrasal-dim);color:var(--phrasal)}
.vocab-type.id{background:var(--idiom-dim);color:var(--idiom)}
.vocab-type.ue{background:var(--accent-dim);color:var(--accent)}
.vocab-example{color:var(--text-muted);font-style:italic}
/* POPUP */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
  align-items:flex-end;justify-content:center;padding:16px}
.popup-overlay.show{display:flex}
.popup-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;max-width:400px;width:100%;animation:slideUp .25s ease}
.popup-close{position:absolute;top:12px;right:14px;background:none;border:none;color:var(--text-muted);
  font-size:20px;cursor:pointer;padding:4px;line-height:1}
.popup-close:hover{color:var(--text)}
.popup-expr{font-size:18px;font-weight:800;margin-bottom:4px}
.popup-expr.pv{color:var(--phrasal)}.popup-expr.id{color:var(--idiom)}
.popup-type{font-size:11px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.popup-type.pv{color:var(--phrasal)}.popup-type.id{color:var(--idiom)}
.popup-row{margin-bottom:10px}
.popup-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.popup-value{font-size:14px;color:var(--text);line-height:1.5}
.popup-example{font-style:italic;color:var(--text-muted)}
/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);
  background:var(--card);color:var(--text);padding:12px 24px;border-radius:var(--radius);
  border:1px solid var(--border);font-size:13px;font-weight:600;z-index:200;
  transition:transform .3s ease;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{transform:translateX(-50%) translateY(0)}
/* ERRO */
.error-msg{background:var(--danger-dim);border:1px solid rgba(239,68,68,.3);color:var(--danger);
  padding:14px 18px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:13px;line-height:1.5}
/* ANIMAÇÕES */
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@keyframes pulse-bar{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
/* RESPONSIVO */
@media(max-width:500px){
  .app{padding:0 10px 60px}
  h1{font-size:18px}
  .sentence-text{font-size:15px}
  .story-title{font-size:17px}
  .card-controls .btn{font-size:11px;padding:8px 6px}
  .comparison.show{grid-template-columns:1fr}
  .vocab-table{font-size:11px}
  .vocab-table th,.vocab-table td{padding:8px 5px}
  .controls-bar{gap:6px}
  .level-tab{padding:7px 13px;font-size:12px}
  .btn{padding:9px 13px;font-size:12px}
  .legend{font-size:11px;gap:8px}
}
/* SCROLLBAR */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#3a3d4a}
/* FOCUS */
.btn:focus-visible,.level-tab:focus-visible,.ctrl-select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* REDUZIR MOVIMENTO */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="header-row">
      <h1>ShadowSpeak</h1>
      <div class="legend">
        <span class="legend-item"><span class="legend-dot g"></span>Phrasal Verb</span>
        <span class="legend-item"><span class="legend-dot y"></span>Idiom</span>
        <span class="legend-item"><span class="legend-dot b">B</span>Word Stress</span>
      </div>
    </div>
  </header>
  <div class="controls-bar">
    <div class="level-tabs" id="levelTabs" role="tablist"></div>
    <div class="ctrl-group">
      <label for="speedSelect">Speed</label>
      <select class="ctrl-select" id="speedSelect">
        <option value="0.7">0.7x</option>
        <option value="0.85">0.85x</option>
        <option value="1" selected>1.0x</option>
        <option value="1.15">1.15x</option>
      </select>
    </div>
    <div class="ctrl-group">
      <label for="recTimeSelect">Rec Time</label>
      <select class="ctrl-select" id="recTimeSelect">
        <option value="3">3s</option>
        <option value="5" selected>5s</option>
        <option value="7">7s</option>
        <option value="10">10s</option>
      </select>
    </div>
  </div>
  <div class="shadow-banner" id="shadowBanner">
    <span class="shadow-pulse"></span>
    <span>Shadowing Mode Active</span>
    <button class="btn btn-sm btn-danger" id="stopShadowBtn">Stop</button>
  </div>
  <section class="story-header">
    <h2 class="story-title" id="storyTitle"></h2>
    <div class="story-actions">
      <button class="btn" id="listenFullBtn">Listen Full Story</button>
      <button class="btn btn-accent" id="shadowModeBtn">Shadowing Mode</button>
      <button class="btn" id="newStoryBtn">New Story</button>
    </div>
  </section>
  <div class="progress-section">
    <div class="progress-info">
      <span id="progressText">Sentence 1 of 1</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-nav">
      <button class="btn btn-sm btn-ghost" id="prevBtn">Prev</button>
      <button class="btn btn-sm btn-ghost" id="nextBtn">Next</button>
    </div>
  </div>
  <div id="errorContainer"></div>
  <main id="sentenceContainer"></main>
  <section class="vocab-section" id="vocabSection"></section>
</div>
<div class="popup-overlay" id="popupOverlay">
  <div class="popup-box" id="popupBox" style="position:relative">
    <button class="popup-close" id="popupClose" aria-label="Close">&times;</button>
    <div id="popupContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DADOS DAS HISTÓRIAS — 10 histórias (A1, A2, B1)
   ============================================================ */
const STORIES = [
  // ==================== A1 ====================
  {
    id:1, level:'A1', title:'My Morning',
    sentences:[
      {text:'I usually <span class="phrasal" data-idx="0">wake up</span> around <span class="stress">SE</span>ven in the morning.',translation:'Eu acordo por volta das sete da manhã.'},
      {text:'Some<span class="stress">TI</span>mes I don\'t want to <span class="phrasal" data-idx="1">get up</span> right a<span class="stress">WAY</span>.',translation:'Às vezes não quero levantar logo de uma vez.'},
      {text:'I stay in bed for a few <span class="stress">MI</span>nutes and check my phone.',translation:'Fico na cama por alguns minutos e olho o celular.'},
      {text:'Then I <span class="phrasal" data-idx="2">put on</span> my clothes and walk to the <span class="stress">KI</span>tchen.',translation:'Então me visto e vou para a cozinha.'},
      {text:'I <span class="phrasal" data-idx="3">turn on</span> the co<span class="stress">FFEE</span> machine and <span class="phrasal" data-idx="4">sit down</span> at the table.',translation:'Ligo a máquina de café e sento na mesa.'},
      {text:'Making coffee is <span class="idiom" data-idx="0">a piece of cake</span> — I do it e<span class="stress">VE</span>ry day.',translation:'Fazer café é moleza — faço isso todo dia.'},
      {text:'My roommate says it\'s <span class="idiom" data-idx="1">no big deal</span>, but I think good coffee is im<span class="stress">POR</span>tant.',translation:'Meu colega de quarto diz que não é grande coisa, mas acho que um bom café é importante.'},
      {text:'<span class="idiom" data-idx="2">So far, so good</span> — no bad news on my phone.',translation:'Até agora, tudo bem — nenhuma má notícia no celular.'},
      {text:'I tell myself to <span class="idiom" data-idx="3">take it easy</span> this morning.',translation:'Me digo para ficar tranquilo esta manhã.'},
      {text:'I eat a quick break<span class="stress">FAST</span> — some bread and cheese.',translation:'Como um café da manhã rápido — pão e queijo.'},
      {text:'After that, I brush my teeth and grab my keys.',translation:'Depois disso, escovo os dentes e pego minhas chaves.'},
      {text:'I open the win<span class="stress">DOW</span> and feel the fresh air.',translation:'Abro a janela e sinto o ar fresco.'},
      {text:'The wea<span class="stress">THER</span> looks nice, so maybe I\'ll walk to work to<span class="stress">DAY</span>.',translation:'O tempo parece bom, então talvez eu vá a pé para o trabalho hoje.'},
      {text:'<span class="idiom" data-idx="4">Sounds good</span>, I think, time to start the day.',translation:'Boa, penso, hora de começar o dia.'}
    ],
    phrasalVerbs:[
      {expr:'wake up',meaning:'acordar',explanation:'Parar de dormir e ficar acordado.',example:'What time do you wake up on weekends?'},
      {expr:'get up',meaning:'levantar (da cama)',explanation:'Sair da cama depois de dormir.',example:'I get up at 6 AM for work.'},
      {expr:'put on',meaning:'vestir, colocar',explanation:'Colocar uma roupa ou algo no corpo.',example:'Put on your jacket, it\'s cold outside.'},
      {expr:'turn on',meaning:'ligar',explanation:'Acionar um aparelho ou dispositivo.',example:'Can you turn on the TV, please?'},
      {expr:'sit down',meaning:'sentar',explanation:'Colocar-se na posição sentada.',example:'Please sit down and make yourself comfortable.'}
    ],
    idioms:[
      {expr:'a piece of cake',meaning:'moleza, muito fácil',explanation:'Algo muito fácil de fazer.',example:'The test was a piece of cake.'},
      {expr:'no big deal',meaning:'não é grande coisa',explanation:'Algo que não é importante ou sério.',example:'I forgot my umbrella, but it\'s no big deal.'},
      {expr:'so far, so good',meaning:'até agora, tudo bem',explanation:'As coisas estão indo bem até este ponto.',example:'I\'ve been studying for two hours. So far, so good.'},
      {expr:'take it easy',meaning:'ficar tranquilo',explanation:'Relaxar, não se preocupar demasiado.',example:'You look tired. Take it easy tonight.'},
      {expr:'sounds good',meaning:'soa bem, boa ideia',explanation:'Usado para concordar com uma sugestão.',example:'Let\'s meet at 5. — Sounds good.'}
    ]
  },
  {
    id:2, level:'A1', title:'Supermarket Shopping',
    sentences:[
      {text:'I need to go to the su<span class="stress">PER</span>market be<span class="stress">CAUSE</span> we <span class="phrasal" data-idx="0">ran out of</span> milk and bread.',translation:'Preciso ir ao supermercado porque acabou o leite e o pão.'},
      {text:'When I ar<span class="stress">RI</span>ved, I <span class="phrasal" data-idx="1">looked for</span> a shop<span class="stress">PING</span> cart but they were all gone.',translation:'Quando cheguei, procurei um carrinho de compras, mas não tinha nenhum.'},
      {text:'That was <span class="idiom" data-idx="0">no big deal</span>, so I grabbed a bas<span class="stress">KET</span> in<span class="stress">STEAD</span>.',translation:'Não foi grande coisa, então peguei uma cesta no lugar.'},
      {text:'First I went to the fruit sec<span class="stress">TI</span>on and <span class="phrasal" data-idx="2">picked up</span> some ba<span class="stress">NA</span>nas and ap<span class="stress">PLES</span>.',translation:'Primeiro fui à seção de frutas e peguei algumas bananas e maçãs.'},
      {text:'The stra<span class="stress">WBE</span>ries were <span class="idiom" data-idx="1">on sale</span>, so I got two bo<span class="stress">XES</span>.',translation:'Os morangos estavam em promoção, então peguei duas caixas.'},
      {text:'Then I <span class="phrasal" data-idx="3">put back</span> the ex<span class="stress">PEN</span>sive cheese and chose a chea<span class="stress">PER</span> one.',translation:'Aí devolvi o queijo caro e escolhi um mais barato.'},
      {text:'I asked a wor<span class="stress">KER</span> if they had cot<span class="stress">TAGE</span> cheese, but it was <span class="idiom" data-idx="2">out of stock</span>.',translation:'Perguntei a um funcionário se tinham cottage cheese, mas estava fora de estoque.'},
      {text:'I was <span class="idiom" data-idx="3">in a hurry</span>, so I didn\'t want to waste time.',translation:'Estava com pressa, então não queria perder tempo.'},
      {text:'I <span class="phrasal" data-idx="4">paid for</span> eve<span class="stress">RY</span>thing and left <span class="idiom" data-idx="4">right away</span>.',translation:'Paguei por tudo e sai imediatamente.'},
      {text:'When I got home, I real<span class="stress">I</span>zed I for<span class="stress">GOT</span> the eggs.',translation:'Quando cheguei em casa, percebi que esqueci os ovos.'},
      {text:'Well, <span class="idiom" data-idx="5">you can\'t have it all</span> — at least I got most of the things.',translation:'Bom, ninguém tem tudo — pelo menos peguei a maioria das coisas.'}
    ],

   ESTADO DA APLICAÇÃO
   ============================================================ */
const state = {
  level: 'A1',
  storyId: 1,
  speed: 1,
  recTime: 5,
  currentSentence: 0,
  shadowingMode: false,
  shadowingState: 'idle', // idle, playing, waiting, recording, playingBack, comparing
  recordings: {}, // { sentenceIndex: audioURL }
  mediaRecorder: null,
  mediaStream: null,
  recTimer: null,
  recSeconds: 0,
  fullStoryPlaying: false,
  shadowTimeouts: []
};

/* ============================================================
   UTILITÁRIOS
   ============================================================ */
function stripHTML(html) {
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent || d.innerText || '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2500);
}

function getStory() {
  return STORIES.find(s => s.id === state.storyId) || STORIES[0];
}

function getStoriesByLevel(level) {
  return STORIES.filter(s => s.level === level);
}

/* ============================================================
   PERSISTÊNCIA (localStorage)
   ============================================================ */
function saveState() {
  try {
    localStorage.setItem('shadowSpeak', JSON.stringify({
      level: state.level,
      storyId: state.storyId,
      speed: state.speed,
      recTime: state.recTime,
      currentSentence: state.currentSentence
    }));
  } catch(e) {}
}

function loadState() {
  try {
    const d = JSON.parse(localStorage.getItem('shadowSpeak'));
    if (d) {
      if (d.level) state.level = d.level;
      if (d.storyId) state.storyId = d.storyId;
      if (d.speed) state.speed = d.speed;
      if (d.recTime) state.recTime = d.recTime;
      if (typeof d.currentSentence === 'number') state.currentSentence = d.currentSentence;
    }
  } catch(e) {}
}

/* ============================================================
   SISTEMA DE VOZ (speechSynthesis)
   ============================================================ */
let enUSVoice = null;
let voicesReady = false;

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (voices.length > 0) {
    voicesReady = true;
    enUSVoice = voices.find(v => v.lang === 'en-US') ||
                voices.find(v => v.lang.startsWith('en')) || null;
  }
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text, rate, onEnd) {
  speechSynthesis.cancel();
  if (!text || !text.trim()) { if (onEnd) onEnd(); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = rate || state.speed;
  if (enUSVoice) u.voice = enUSVoice;
  if (onEnd) u.onend = onEnd;
  u.onerror = function() { if (onEnd) onEnd(); };
  speechSynthesis.speak(u);
}

function speakSentence(index, rate, onEnd) {
  const story = getStory();
  if (index < 0 || index >= story.sentences.length) { if (onEnd) onEnd(); return; }
  const plain = stripHTML(story.sentences[index].text);
  speak(plain, rate, onEnd);
}

/* ============================================================
   SISTEMA DE GRAVAÇÃO (MediaRecorder)
   ============================================================ */
function checkMediaRecorderSupport() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
  if (typeof MediaRecorder === 'undefined') return false;
  return true;
}

async function startRecording(cardIndex) {
  // Limpar gravação anterior
  if (state.recordings[cardIndex]) {
    URL.revokeObjectURL(state.recordings[cardIndex]);
    delete state.recordings[cardIndex];
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    state.mediaStream = stream;
    const chunks = [];
    state.mediaRecorder = new MediaRecorder(stream);
    state.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    state.mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'audio/webm' });
      state.recordings[cardIndex] = URL.createObjectURL(blob);
      stream.getTracks().forEach(t => t.stop());
      state.mediaStream = null;
      updateCardUI(cardIndex);
    };
    state.mediaRecorder.start();
    return true;
  } catch(err) {
    state.mediaStream = null;
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      showToast('Microphone permission is needed for recording.');
    } else {
      showToast('Could not access microphone. Please check your settings.');
    }
    return false;
  }
}

function stopRecording() {
  if (state.mediaRecorder && state.mediaRecorder.state !== 'inactive') {
    state.mediaRecorder.stop();
  }
  clearRecTimer();
}

function startRecTimer(seconds, onTick, onEnd) {
  clearRecTimer();
  state.recSeconds = seconds;
  onTick(state.recSeconds);
  state.recTimer = setInterval(() => {
    state.recSeconds--;
    onTick(state.recSeconds);
    if (state.recSeconds <= 0) {
      clearRecTimer();
      onEnd();
    }
  }, 1000);
}

function clearRecTimer() {
  if (state.recTimer) { clearInterval(state.recTimer); state.recTimer = null; }
}

function playRecording(cardIndex) {
  const url = state.recordings[cardIndex];
  if (!url) return;
  const audio = new Audio(url);
  audio.play().catch(() => {});
}

/* ============================================================
   RENDERIZAÇÃO
   ============================================================ */
function renderLevelTabs() {
  const container = document.getElementById('levelTabs');
  container.innerHTML = '';
  ['A1','A2','B1'].forEach(lvl => {
    const btn = document.createElement('button');
    btn.className = 'level-tab' + (state.level === lvl ? ' active' : '');
    btn.textContent = lvl;
    btn.setAttribute('role', 'tab');
    btn.setAttribute('aria-selected', state.level === lvl);
    btn.onclick = () => {
      if (state.level === lvl) return;
      state.level = lvl;
      // Selecionar primeira história desse nível
      const stories = getStoriesByLevel(lvl);
      if (stories.length > 0) state.storyId = stories[0].id;
      state.currentSentence = 0;
      state.recordings = {};
      stopShadowingMode();
      speechSynthesis.cancel();
      saveState();
      renderAll();
    };
    container.appendChild(btn);
  });
}

function renderStoryHeader() {
  const story = getStory();
  document.getElementById('storyTitle').textContent = story.title + ' (' + story.level + ')';
}

function renderProgress() {
  const story = getStory();
  const total = story.sentences.length;
  const curr = state.currentSentence + 1;
  const pct = Math.round((curr / total) * 100);
  document.getElementById('progressText').textContent = 'Sentence ' + curr + ' of ' + total;
  document.getElementById('progressPercent').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';
}

function renderSentenceCards() {
  const container = document.getElementById('sentenceContainer');
  container.innerHTML = '';
  const story = getStory();

  story.sentences.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'sentence-card' + (i === state.currentSentence ? ' active' : '') +
                     (state.recordings[i] ? ' done' : '');
    card.id = 'card-' + i;
    card.setAttribute('data-index', i);

    // Número da frase
    let html = '<div class="sentence-num">Sentence ' + (i + 1) + '</div>';

    // Texto
    html += '<div class="sentence-text">' + s.text + '</div>';

    // Tradução
    html += '<div class="translation" id="trans-' + i + '">' + s.translation + '</div>';

    // Indicador "YOUR TURN"
    html += '<div class="your-turn" id="yourturn-' + i + '">YOUR TURN — REPEAT</div>';

    // Indicador de gravação
    html += '<div class="rec-indicator" id="recind-' + i + '"><span class="rec-dot"></span><span id="rectime-' + i + '">Recording: ' + state.recTime + 's</span></div>';

    // Controles
    html += '<div class="card-controls">';
    html += '<button class="btn btn-sm" onclick="handleListen(' + i + ')" title="Listen at selected speed">&#9654; Listen</button>';
    html += '<button class="btn btn-sm" onclick="handleSlow(' + i + ')" title="Listen slowly">&#128034; Slow</button>';
    html += '<button class="btn btn-sm" id="recbtn-' + i + '" onclick="handleRecord(' + i + ')">&#127908; Record</button>';
    html += '<button class="btn btn-sm" id="playbtn-' + i + '" onclick="handlePlayMy(' + i + ')" ' + (state.recordings[i] ? '' : 'disabled') + '>&#9654; My Voice</button>';
    html += '<button class="btn btn-sm" id="trybtn-' + i + '" onclick="handleTryAgain(' + i + ')" ' + (state.recordings[i] ? '' : 'disabled') + '>&#128260; Try Again</button>';
    html += '<button class="btn btn-sm" id="transbtn-' + i + '" onclick="handleToggleTrans(' + i + ')">&#127475;&#127487; Translation</button>';
    html += '</div>';

    // Comparação lado a lado
    html += '<div class="comparison" id="compare-' + i + '">';
    html += '<div class="compare-box"><div class="compare-label">Native Voice</div><button class="btn btn-sm" onclick="handleListen(' + i + ')">&#9654; Listen</button></div>';
    html += '<div class="compare-box"><div class="compare-label">My Voice</div><button class="btn btn-sm" onclick="handlePlayMy(' + i + ')">&#9654; Play My Voice</button></div>';
    html += '</div>';

    card.innerHTML = html;
    container.appendChild(card);
  });

  // Clique nos phrasal verbs e idioms
  container.querySelectorAll('.phrasal').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); showPhrasalPopup(el); });
  });
  container.querySelectorAll('.idiom').forEach(el => {
    el.addEventListener('click', (e) => { e.stopPropagation(); showIdiomPopup(el); });
  });
}

function updateCardUI(index) {
  const card = document.getElementById('card-' + index);
  if (!card) return;
  const hasRec = !!state.recordings[index];
  card.classList.toggle('done', hasRec);
  const playBtn = document.getElementById('playbtn-' + index);
  const tryBtn = document.getElementById('trybtn-' + index);
  const compare = document.getElementById('compare-' + index);
  if (playBtn) playBtn.disabled = !hasRec;
  if (tryBtn) tryBtn.disabled = !hasRec;
  if (compare && hasRec) compare.classList.add('show');
}

function renderVocabulary() {
  const story = getStory();
  const section = document.getElementById('vocabSection');
  let html = '<h3 class="vocab-title">Vocabulary & Expressions</h3>';
  html += '<div style="overflow-x:auto"><table class="vocab-table"><thead><tr>';
  html += '<th>Expression</th><th>Type</th><th>Meaning</th><th>Example</th>';
  html += '</tr></thead><tbody>';

  // Phrasal Verbs
  story.phrasalVerbs.forEach(pv => {
    html += '<tr>';
    html += '<td class="vocab-expr">' + pv.expr + '</td>';
    html += '<td><span class="vocab-type pv">Phrasal Verb</span></td>';
    html += '<td>' + pv.meaning + '</td>';
    html += '<td class="vocab-example">' + pv.example + '</td>';
    html += '</tr>';
  });

  // Idioms
  story.idioms.forEach(id => {
    html += '<tr>';
    html += '<td class="vocab-expr">' + id.expr + '</td>';
    html += '<td><span class="vocab-type id">Idiom</span></td>';
    html += '<td>' + id.meaning + '</td>';
    html += '<td class="vocab-example">' + id.example + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  section.innerHTML = html;
}

function renderAll() {
  renderLevelTabs();
  renderStoryHeader();
  renderProgress();
  renderSentenceCards();
  renderVocabulary();
  updateControls();
  scrollToCurrentCard();
}

function updateControls() {
  document.getElementById('speedSelect').value = state.speed;
  document.getElementById('recTimeSelect').value = state.recTime;
}

function scrollToCurrentCard() {
  setTimeout(() => {
    const card = document.getElementById('card-' + state.currentSentence);
    if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

/* ============================================================
   HANDLERS DOS BOTÕES
   ============================================================ */
function handleListen(index) {
  speechSynthesis.cancel();
  state.currentSentence = index;
  highlightCard(index);
  updateProgress();
  saveState();
  speakSentence(index, state.speed, () => {
    // Após ouvir, mostrar YOUR TURN brevemente
    const yt = document.getElementById('yourturn-' + index);
    if (yt && !state.shadowingMode) {
      yt.classList.add('show');
      setTimeout(() => yt.classList.remove('show'), 2000);
    }
  });
}

function handleSlow(index) {
  speechSynthesis.cancel();
  state.currentSentence = index;
  highlightCard(index);
  updateProgress();
  saveState();
  speakSentence(index, 0.7);
}

function handleRecord(index) {
  if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
    // Parar gravação
    stopRecording();
    const card = document.getElementById('card-' + index);
    if (card) card.classList.remove('recording');
    const ind = document.getElementById('recind-' + index);
    if (ind) ind.classList.remove('show');
    const yt = document.getElementById('yourturn-' + index);
    if (yt) yt.classList.remove('show');
    // Atualizar botão
    const btn = document.getElementById('recbtn-' + index);
    if (btn) { btn.innerHTML = '&#127908; Record'; btn.classList.remove('btn-danger'); }
    return;
  }
  // Iniciar gravação
  const card = document.getElementById('card-' + index);
  const yt = document.getElementById('yourturn-' + index);
  const ind = document.getElementById('recind-' + index);
  const btn = document.getElementById('recbtn-' + index);

  startRecording(index).then(ok => {
    if (!ok) return;
    if (card) card.classList.add('recording');
    if (yt) yt.classList.add('show');
    if (ind) ind.classList.add('show');
    if (btn) { btn.innerHTML = '&#128308; Stop Recording'; btn.classList.add('btn-danger'); }

    startRecTimer(state.recTime,
      (sec) => {
        const timeEl = document.getElementById('rectime-' + index);
        if (timeEl) timeEl.textContent = 'Recording: ' + sec + 's';
      },
      () => {
        stopRecording();
        if (card) card.classList.remove('recording');
        if (ind) ind.classList.remove('show');
        if (yt) yt.classList.remove('show');
        if (btn) { btn.innerHTML = '&#127908; Record'; btn.classList.remove('btn-danger'); }
      }
    );
  });
}

function handlePlayMy(index) {
  playRecording(index);
}

function handleTryAgain(index) {
  // Limpar gravação anterior
  if (state.recordings[index]) {
    URL.revokeObjectURL(state.recordings[index]);
    delete state.recordings[index];
  }
  const compare = document.getElementById('compare-' + index);
  if (compare) compare.classList.remove('show');
  updateCardUI(index);
  // Iniciar nova gravação automaticamente
  handleRecord(index);
}

function handleToggleTrans(index) {
  const el = document.getElementById('trans-' + index);
  const btn = document.getElementById('transbtn-' + index);
  if (!el) return;
  const showing = el.classList.toggle('show');
  if (btn) btn.innerHTML = showing ? '&#127475;&#127487; Hide Translation' : '&#127475;&#127487; Translation';
}

function highlightCard(index) {
  document.querySelectorAll('.sentence-card').forEach((c, i) => {
    c.classList.toggle('active', i === index);
  });
}

function updateProgress() {
  renderProgress();
}

/* ============================================================
   LISTEN FULL STORY
   ============================================================ */
function handleListenFull() {
  if (state.fullStoryPlaying) {
    speechSynthesis.cancel();
    state.fullStoryPlaying = false;
    document.getElementById('listenFullBtn').innerHTML = 'Listen Full Story';
    return;
  }
  state.fullStoryPlaying = true;
  document.getElementById('listenFullBtn').innerHTML = '&#9632; Stop';
  const story = getStory();
  let idx = 0;

  function playNext() {
    if (!state.fullStoryPlaying || idx >= story.sentences.length) {
      state.fullStoryPlaying = false;
      document.getElementById('listenFullBtn').innerHTML = 'Listen Full Story';
      return;
    }
    state.currentSentence = idx;
    highlightCard(idx);
    updateProgress();
    saveState();
    scrollToCurrentCard();

    speakSentence(idx, state.speed, () => {
      idx++;
      setTimeout(playNext, 400);
    });
  }
  playNext();
}

/* ============================================================
   NOVA HISTÓRIA
   ============================================================ */
function handleNewStory() {
  speechSynthesis.cancel();
  stopShadowingMode();
  const stories = getStoriesByLevel(state.level);
  // Filtrar para não repetir a atual
  const others = stories.filter(s => s.id !== state.storyId);
  if (others.length > 0) {
    const rand = others[Math.floor(Math.random() * others.length)];
    state.storyId = rand.id;
  }
  state.currentSentence = 0;
  state.recordings = {};
  saveState();
  renderAll();
  showToast('New story loaded!');
}

/* ============================================================
   MODO SHADOWING
   ============================================================ */
function handleShadowMode() {
  if (state.shadowingMode) {
    stopShadowingMode();
    return;
  }
  state.shadowingMode = true;
  document.getElementById('shadowBanner').classList.add('show');
  document.getElementById('shadowModeBtn').innerHTML = '&#9632; Stop Shadowing';
  shadowingStep();
}

function stopShadowingMode() {
  state.shadowingMode = false;
  state.shadowingState = 'idle';
  // Limpar timeouts
  state.shadowTimeouts.forEach(t => clearTimeout(t));
  state.shadowTimeouts = [];
  // Parar gravação se ativa
  if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
    stopRecording();
  }
  clearRecTimer();
  // Limpar UI
  document.getElementById('shadowBanner').classList.remove('show');
  document.getElementById('shadowModeBtn').innerHTML = 'Shadowing Mode';
  document.querySelectorAll('.sentence-card').forEach(c => c.classList.remove('recording'));
  document.querySelectorAll('.rec-indicator').forEach(el => el.classList.remove('show'));
  document.querySelectorAll('.your-turn').forEach(el => el.classList.remove('show'));
  // Resetar botões de gravação
  document.querySelectorAll('[id^="recbtn-"]').forEach(btn => {
    btn.innerHTML = '&#127908; Record';
    btn.classList.remove('btn-danger');
  });
  speechSynthesis.cancel();
}

function shadowingStep() {
  if (!state.shadowingMode) return;
  const story = getStory();
  const idx = state.currentSentence;
  if (idx >= story.sentences.length) {
    showToast('Story completed! Great job.');
    stopShadowingMode();
    return;
  }

  state.shadowingState = 'playing';
  highlightCard(idx);
  updateProgress();
  saveState();
  scrollToCurrentCard();

  // ETAPA 1: Voz nativa
  speakSentence(idx, state.speed, () => {
    if (!state.shadowingMode) return;

    // ETAPA 2: Pausa de 1 segundo
    const t1 = setTimeout(() => {
      if (!state.shadowingMode) return;

      // ETAPA 3: YOUR TURN
      state.shadowingState = 'waiting';
      const yt = document.getElementById('yourturn-' + idx);
      if (yt) yt.classList.add('show');

      // ETAPA 4: Iniciar gravação após breve pausa
      const t2 = setTimeout(() => {
        if (!state.shadowingMode) return;
        state.shadowingState = 'recording';

        startRecording(idx).then(ok => {
          if (!ok) { stopShadowingMode(); return; }
          const card = document.getElementById('card-' + idx);
          const ind = document.getElementById('recind-' + idx);
          const btn = document.getElementById('recbtn-' + idx);
          if (card) card.classList.add('recording');
          if (ind) ind.classList.add('show');
          if (btn) { btn.innerHTML = '&#128308; Stop Recording'; btn.classList.add('btn-danger'); }

          // ETAPA 5 & 6: Timer e parar automaticamente
          startRecTimer(state.recTime,
            (sec) => {
              const timeEl = document.getElementById('rectime-' + idx);
              if (timeEl) timeEl.textContent = 'Recording: ' + sec + 's';
            },
            () => {
              if (!state.shadowingMode) return;
              stopRecording();
              if (card) card.classList.remove('recording');
              if (ind) ind.classList.remove('show');
              if (yt) yt.classList.remove('show');
              if (btn) { btn.innerHTML = '&#127908; Record'; btn.classList.remove('btn-danger'); }

              // ETAPA 7: Reproduzir gravação do usuário
              state.shadowingState = 'playingBack';
              const t3 = setTimeout(() => {
                if (!state.shadowingMode) return;
                playRecording(idx);

                // ETAPA 8: Comparação
                const t4 = setTimeout(() => {
                  if (!state.shadowingMode) return;
                  state.shadowingState = 'comparing';
                  const compare = document.getElementById('compare-' + idx);
                  if (compare) compare.classList.add('show');
                  updateCardUI(idx);

                  // ETAPA 9: Mostrar botão Next (usamos toast + next automático ou manual)
                  // Aqui o usuário pode clicar Next manualmente
                }, 1000);
                state.shadowTimeouts.push(t4);
              }, 500);
              state.shadowTimeouts.push(t3);
            }
          );
        });
      }, 600);
      state.shadowTimeouts.push(t2);
    }, 1000);
    state.shadowTimeouts.push(t1);
  });
}

/* ============================================================
   NAVEGAÇÃO ENTRE FRASES
   ============================================================ */
function handlePrev() {
  const story = getStory();
  if (state.currentSentence > 0) {
    state.currentSentence--;
    highlightCard(state.currentSentence);
    updateProgress();
    saveState();
    scrollToCurrentCard();
  }
}

function handleNext() {
  const story = getStory();
  if (state.currentSentence < story.sentences.length - 1) {
    state.currentSentence++;
    highlightCard(state.currentSentence);
    updateProgress();
    saveState();
    scrollToCurrentCard();
    // Se estiver em shadowing mode, avançar para próximo passo
    if (state.shadowingMode && state.shadowingState === 'comparing') {
      state.shadowTimeouts.forEach(t => clearTimeout(t));
      state.shadowTimeouts = [];
      shadowingStep();
    }
  }
}

/* ============================================================
   POPUP — Phrasal Verbs e Idioms
   ============================================================ */
function showPhrasalPopup(el) {
  const idx = parseInt(el.getAttribute('data-idx'));
  const story = getStory();
  const pv = story.phrasalVerbs[idx];
  if (!pv) return;

  const content = document.getElementById('popupContent');
  content.innerHTML =
    '<div class="popup-expr pv">' + pv.expr + '</div>' +
    '<div class="popup-type pv">Phrasal Verb</div>' +
    '<div class="popup-row"><div class="popup-label">Meaning</div><div class="popup-value">' + pv.meaning + '</div></div>' +
    '<div class="popup-row"><div class="popup-label">Explanation</div><div class="popup-value">' + pv.explanation + '</div></div>' +
    '<div class="popup-row"><div class="popup-label">Example</div><div class="popup-value popup-example">"' + pv.example + '"</div></div>';
  document.getElementById('popupOverlay').classList.add('show');
}

function showIdiomPopup(el) {
  const idx = parseInt(el.getAttribute('data-idx'));
  const story = getStory();
  const id = story.idioms[idx];
  if (!id) return;

  const content = document.getElementById('popupContent');
  content.innerHTML =
    '<div class="popup-expr id">' + id.expr + '</div>' +
    '<div class="popup-type id">Idiom / Expression</div>' +
    '<div class="popup-row"><div class="popup-label">Translation</div><div class="popup-value">' + id.meaning + '</div></div>' +
    '<div class="popup-row"><div class="popup-label">Meaning</div><div class="popup-value">' + id.meaning + '</div></div>' +
    '<div class="popup-row"><div class="popup-label">Example</div><div class="popup-value popup-example">"' + id.example + '"</div></div>';
  document.getElementById('popupOverlay').classList.add('show');
}

function hidePopup() {
  document.getElementById('popupOverlay').classList.remove('show');
}

/* ============================================================
   VERIFICAÇÃO DE COMPATIBILIDADE
   ============================================================ */
function checkCompatibility() {
  const container = document.getElementById('errorContainer');
  let msg = '';
  if (!('speechSynthesis' in window)) {
    msg = 'Your browser does not support text-to-speech. Please use a modern browser like Chrome, Edge, or Safari.';
  } else if (!checkMediaRecorderSupport()) {
    msg = 'Your browser does not support audio recording. Please use a modern browser like Chrome, Edge, or Safari for the full experience.';
  }
  if (msg) {
    container.innerHTML = '<div class="error-msg">' + msg + '</div>';
  }
}

/* ============================================================
   EVENT LISTENERS
   ============================================================ */
function setupEventListeners() {
  document.getElementById('speedSelect').addEventListener('change', (e) => {
    state.speed = parseFloat(e.target.value);
    saveState();
  });

  document.getElementById('recTimeSelect').addEventListener('change', (e) => {
    state.recTime = parseInt(e.target.value);
    saveState();
  });

  document.getElementById('listenFullBtn').addEventListener('click', handleListenFull);
  document.getElementById('shadowModeBtn').addEventListener('click', handleShadowMode);
  document.getElementById('newStoryBtn').addEventListener('click', handleNewStory);
  document.getElementById('prevBtn').addEventListener('click', handlePrev);
  document.getElementById('nextBtn').addEventListener('click', handleNext);
  document.getElementById('stopShadowBtn').addEventListener('click', stopShadowingMode);

  document.getElementById('popupOverlay').addEventListener('click', (e) => {
    if (e.target === document.getElementById('popupOverlay')) hidePopup();
  });
  document.getElementById('popupClose').addEventListener('click', hidePopup);

  // Teclado: ESC para fechar popup
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hidePopup();
  });

  // Salvar estado ao sair
  window.addEventListener('beforeunload', saveState);
}

/* ============================================================
   INICIALIZAÇÃO
   ============================================================ */
function init() {
  loadState();
  // Garantir que storyId corresponde ao nível
  const levelStories = getStoriesByLevel(state.level);
  if (levelStories.length > 0 && !levelStories.find(s => s.id === state.storyId)) {
    state.storyId = levelStories[0].id;
    state.currentSentence = 0;
  }
  checkCompatibility();
  setupEventListeners();
  renderAll();
}

init();
</script>

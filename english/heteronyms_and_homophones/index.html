<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FlashCards Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --mode-color: #0D9488;
      --mode-color-light: rgba(13,148,136,0.08);
      --mode-color-glow: rgba(13,148,136,0.25);
      --bg: #F4F6F8;
      --surface: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --border: #E2E8F0;
      --orange: #EA580C;
      --orange-light: rgba(234,88,12,0.08);
      --emerald: #059669;
      --emerald-light: rgba(5,150,105,0.1);
      --radius-lg: 28px;
      --radius-full: 999px;
      --shadow-card: 0 20px 50px -12px rgba(0,0,0,0.12), 0 4px 16px -4px rgba(0,0,0,0.06);
      --shadow-btn: 0 4px 14px -2px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      top: -20%; right: -15%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(13,148,136,0.05) 0%, transparent 70%);
    }
    body::after {
      bottom: -15%; left: -10%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(234,88,12,0.04) 0%, transparent 70%);
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 10px) 18px env(safe-area-inset-bottom, 10px);
      position: relative;
      z-index: 1;
      animation: appEnter 0.5s ease-out;
    }

    @keyframes appEnter {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 2px;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.3px;
    }
    .app-title span {
      color: var(--mode-color);
      transition: color 0.3s;
    }

    .lang-toggle {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      padding: 3px;
      box-shadow: var(--shadow-btn);
    }

    .lang-btn {
      background: none;
      border: none;
      padding: 5px 14px;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s;
      letter-spacing: 0.5px;
    }

    .lang-btn.active {
      background: var(--text-primary);
      color: white;
      box-shadow: 0 2px 8px rgba(15,23,42,0.2);
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      background: var(--surface);
      border-radius: var(--radius-full);
      padding: 5px;
      box-shadow: var(--shadow-btn);
      border: 1px solid var(--border);
    }

    .mode-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 11px 6px;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-secondary);
      transition: all 0.3s cubic-bezier(0.23,1,0.32,1);
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: -0.1px;
    }

    .mode-btn.active {
      background: var(--mode-color);
      color: white;
      font-weight: 700;
      box-shadow: 0 6px 18px var(--mode-color-glow);
    }

    .progress-section {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding: 0 2px;
    }

    .progress-bar-track {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--mode-color);
      border-radius: 10px;
      transition: width 0.4s cubic-bezier(0.23,1,0.32,1), background 0.3s;
      width: 10%;
    }

    .progress-text {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      min-width: 48px;
      text-align: right;
      letter-spacing: -0.2px;
    }

    .shuffle-btn {
      background: var(--surface);
      border: 1.5px solid rgba(234,88,12,0.25);
      color: var(--orange);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.78rem;
      padding: 7px 14px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-btn);
      white-space: nowrap;
    }

    .shuffle-btn:active {
      background: var(--orange);
      color: white;
      transform: scale(0.95);
    }

    .shuffle-icon {
      display: inline-flex;
      width: 14px;
      height: 14px;
    }

    .card-scene {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      min-height: 0;
      margin: 4px 0;
    }

    .card {
      width: 100%;
      max-width: 340px;
      aspect-ratio: 5 / 6;
      max-height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.23, 1, 0.32, 1);
      cursor: pointer;
      border-radius: var(--radius-lg);
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: var(--surface);
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(226,232,240,0.6);
      overflow: hidden;
    }

    .card-face::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: var(--mode-color);
      transition: background 0.3s;
    }

    .card-front {
      background:
        radial-gradient(ellipse at 25% 85%, var(--mode-color-light) 0%, transparent 50%),
        radial-gradient(ellipse at 75% 15%, var(--orange-light) 0%, transparent 50%),
        var(--surface);
      padding: 28px 22px;
    }

    .front-mode-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--mode-color);
      background: var(--mode-color-light);
      padding: 4px 14px;
      border-radius: var(--radius-full);
      margin-bottom: 20px;
      transition: all 0.3s;
    }

    .front-word {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--text-primary);
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .front-word-accent {
      display: block;
      width: 36px;
      height: 4px;
      background: var(--mode-color);
      border-radius: 2px;
      margin: 14px auto 0;
      transition: background 0.3s;
    }

    .front-sub {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-top: 14px;
      background: rgba(241,245,249,0.8);
      padding: 5px 16px;
      border-radius: var(--radius-full);
    }

    .tap-hint {
      margin-top: auto;
      padding-top: 16px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tap-hint-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6rem;
      color: var(--text-muted);
    }

    .card-back {
      transform: rotateY(180deg);
      justify-content: flex-start;
      padding: 28px 18px 18px;
      overflow-y: auto;
      overscroll-behavior: contain;
      background:
        radial-gradient(ellipse at 50% 0%, var(--mode-color-light) 0%, transparent 40%),
        var(--surface);
    }

    .back-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 16px;
      letter-spacing: -0.3px;
    }

    .meaning-block {
      background: #F8FAFC;
      border-radius: 18px;
      padding: 14px 14px 14px 18px;
      margin-bottom: 10px;
      width: 100%;
      border-left: 4px solid var(--mode-color);
      text-align: left;
      transition: border-color 0.3s;
    }

    .pronunciation-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .pronunciation {
      font-weight: 700;
      color: var(--mode-color);
      font-size: 0.95rem;
      background: var(--mode-color-light);
      padding: 3px 12px;
      border-radius: var(--radius-full);
      transition: all 0.3s;
    }

    .audio-btn {
      background: var(--emerald-light);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .audio-btn:active {
      background: var(--emerald);
      transform: scale(1.12);
    }

    .audio-btn:active svg { stroke: white; }

    .audio-btn svg {
      width: 16px;
      height: 16px;
      stroke: var(--emerald);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pos-badge {
      display: inline-block;
      background: var(--orange);
      color: white;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: var(--radius-full);
      letter-spacing: 0.3px;
      text-transform: lowercase;
    }

    .definition {
      font-size: 0.87rem;
      color: var(--text-secondary);
      margin-top: 8px;
      line-height: 1.45;
      font-weight: 500;
    }

    .homo-word-card {
      background: #F8FAFC;
      border-radius: 18px;
      padding: 14px 14px 14px 18px;
      margin-bottom: 10px;
      width: 100%;
      border-left: 4px solid var(--mode-color);
      text-align: left;
      transition: border-color 0.3s;
    }

    .homo-word-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .homo-word-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.2px;
    }

    .back-tap-hint {
      margin-top: auto;
      padding-top: 10px;
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-muted);
      text-align: center;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 6px;
      padding: 2px 0;
    }

    .nav-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      padding: 13px 20px;
      border-radius: var(--radius-full);
      font-family: inherit;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-btn);
    }

    .nav-btn.primary {
      background: var(--mode-color);
      border-color: var(--mode-color);
      color: white;
      box-shadow: 0 6px 18px var(--mode-color-glow);
    }

    .nav-btn:active { transform: scale(0.95); }
    .nav-btn:disabled { opacity: 0.4; pointer-events: none; }

    .nav-btn svg {
      width: 16px; height: 16px;
      stroke: currentColor; fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .nav-btn.primary svg { stroke: white; }

    .hint-row {
      text-align: center;
      padding: 8px 0 2px;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .hint-row kbd {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .card-scene.exit-left  { animation: exitL 0.18s ease-in forwards; }
    .card-scene.enter-right { animation: enterR 0.22s ease-out; }
    .card-scene.exit-right  { animation: exitR 0.18s ease-in forwards; }
    .card-scene.enter-left  { animation: enterL 0.22s ease-out; }

    @keyframes exitL  { to { opacity: 0; transform: translateX(-35px) scale(0.97); } }
    @keyframes enterR { from { opacity: 0; transform: translateX(35px) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes exitR  { to { opacity: 0; transform: translateX(35px) scale(0.97); } }
    @keyframes enterL { from { opacity: 0; transform: translateX(-35px) scale(0.97); } to { opacity: 1; transform: translateX(0) scale(1); } }

    .card-back::-webkit-scrollbar { width: 3px; }
    .card-back::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

    @media (max-height: 640px) {
      .front-mode-label { margin-bottom: 12px; padding: 3px 10px; font-size: 0.65rem; }
      .front-word { font-size: 2.2rem; }
      .front-word-accent { margin-top: 10px; width: 28px; height: 3px; }
      .front-sub { margin-top: 10px; font-size: 0.82rem; }
      .tap-hint { padding-top: 10px; }
      .card { aspect-ratio: 5 / 5.5; }
      .back-title { font-size: 1.3rem; margin-bottom: 12px; }
      .meaning-block, .homo-word-card { padding: 10px 12px 10px 16px; margin-bottom: 8px; }
      .hint-row { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card-scene.exit-left, .card-scene.enter-right,
      .card-scene.exit-right, .card-scene.enter-left { animation: none; }
      .app-container { animation: none; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <div class="header-row">
    <div class="app-title">FlashCards <span>Pro</span></div>
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="pt">PT</button>
    </div>
  </div>

  <div class="mode-tabs">
    <button class="mode-btn active" id="heteronymsTab"></button>
    <button class="mode-btn" id="homophonesTab"></button>
  </div>

  <div class="progress-section">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <span class="progress-text" id="progressText"></span>
    <button class="shuffle-btn" id="shuffleBtn">
      <span class="shuffle-icon">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 4h3l3 4-3 4H2"/><path d="M14 4h-3l-3 4 3 4h3"/>
          <path d="M10 2l2 2-2 2"/><path d="M6 10l-2 2 2 2"/>
        </svg>
      </span>
      <span id="shuffleLabel"></span>
    </button>
  </div>

  <div class="card-scene" id="cardScene">
    <div class="card" id="flashcard">
      <div class="card-face card-front" id="cardFront">
        <div class="front-mode-label" id="frontModeLabel"></div>
        <div class="front-word" id="frontMain"></div>
        <div class="front-word-accent"></div>
        <div class="front-sub" id="frontSub"></div>
        <div class="tap-hint">
          <span class="tap-hint-dot">?</span>
          <span id="tapHintText"></span>
        </div>
      </div>
      <div class="card-face card-back" id="cardBack"></div>
    </div>
  </div>

  <div class="nav-row">
    <button class="nav-btn" id="prevBtn">
      <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      <span id="prevLabel"></span>
    </button>
    <button class="nav-btn primary" id="nextBtn">
      <span id="nextLabel"></span>
      <svg viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="hint-row" id="hintRow"></div>
</div>

    var p = pos.toLowerCase();
    if (p === 'noun') return t('noun');
    if (p === 'verb') return t('verb');
    if (p === 'adj') return t('adj');
    return pos;
  }

  /* pega a definição no idioma atual, com fallback */
  function getDef(defObj) {
    if (typeof defObj === 'string') return defObj;
    return defObj[lang] || defObj.en || '';
  }

  /* formata o par para exibição: ["Air","Heir"] → "Air / Heir" */
  function formatPair(pairArr) {
    return pairArr.join(' / ');
  }

  /* ================================
     Cores por modo
     ================================ */
  function applyModeColors() {
    var r = document.documentElement.style;
    if (currentMode === 'heteronyms') {
      r.setProperty('--mode-color', '#0D9488');
      r.setProperty('--mode-color-light', 'rgba(13,148,136,0.08)');
      r.setProperty('--mode-color-glow', 'rgba(13,148,136,0.25)');
    } else {
      r.setProperty('--mode-color', '#D97706');
      r.setProperty('--mode-color-light', 'rgba(217,119,6,0.08)');
      r.setProperty('--mode-color-glow', 'rgba(217,119,6,0.25)');
    }
  }

  /* ================================
     Atualizar interface
     ================================ */
  function updateUI() {
    heteroTab.textContent = t('heteronyms');
    homoTab.textContent = t('homophones');
    shuffleLabel.textContent = t('shuffle');
    prevLabel.textContent = t('prev');
    nextLabel.textContent = t('next');
    tapHintText.textContent = t('tapHint');
    hintRow.innerHTML = t('keyboard');
    updateProgress();
    renderFront();
  }

  function updateProgress() {
    var list = getList();
    var total = list.length;
    var current = total > 0 ? currentIndex + 1 : 0;
    progressText.textContent = current + ' ' + t('of') + ' ' + total;
    progressBar.style.width = (total > 0 ? (current / total) * 100 : 0) + '%';
  }

  /* ================================
     Renderização
     ================================ */
  function renderFront() {
    var list = getList();
    if (!list.length) {
      frontModeLabel.textContent = '';
      frontMain.textContent = '\u2014';
      frontSub.textContent = '';
      return;
    }
    var item = list[currentIndex];
    frontModeLabel.textContent = currentMode === 'heteronyms' ? t('heteronyms') : t('homophones');

    if (currentMode === 'heteronyms') {
      frontMain.textContent = item.word;
      frontSub.textContent = item.meanings.length + ' ' + t('meanings');
    } else {
      /* pair é array: ["Air","Heir"] */
      frontMain.textContent = formatPair(item.pair);
      frontSub.textContent = t('homophones');
    }
  }

  function renderBack() {
    var list = getList();
    if (!list.length) { cardBack.innerHTML = ''; return; }
    var item = list[currentIndex];
    cardBack.innerHTML = '';

    if (currentMode === 'heteronyms') {
      var title = document.createElement('div');
      title.className = 'back-title';
      title.textContent = item.word;
      cardBack.appendChild(title);

      item.meanings.forEach(function(m) {
        var block = document.createElement('div');
        block.className = 'meaning-block';

        var pronRow = document.createElement('div');
        pronRow.className = 'pronunciation-row';

        var pron = document.createElement('span');
        pron.className = 'pronunciation';
        pron.textContent = m.pronunciation;

        pronRow.appendChild(pron);
        pronRow.appendChild(createAudioBtn(item.word));
        block.appendChild(pronRow);

        var badge = document.createElement('span');
        badge.className = 'pos-badge';
        badge.textContent = posLabel(m.pos);
        block.appendChild(badge);

        var def = document.createElement('div');
        def.className = 'definition';
        def.textContent = getDef(m.definition);
        block.appendChild(def);

        cardBack.appendChild(block);
      });
    } else {
      var title = document.createElement('div');
      title.className = 'back-title';
      title.textContent = formatPair(item.pair);
      cardBack.appendChild(title);

      item.words.forEach(function(w) {
        var card = document.createElement('div');
        card.className = 'homo-word-card';

        var header = document.createElement('div');
        header.className = 'homo-word-header';

        var name = document.createElement('span');
        name.className = 'homo-word-name';
        name.textContent = w.word;

        header.appendChild(name);
        header.appendChild(createAudioBtn(w.word));
        card.appendChild(header);

        var badge = document.createElement('span');
        badge.className = 'pos-badge';
        badge.textContent = posLabel(w.pos);
        card.appendChild(badge);

        var def = document.createElement('div');
        def.className = 'definition';
        def.textContent = getDef(w.definition);
        card.appendChild(def);

        cardBack.appendChild(card);
      });
    }

    var backHint = document.createElement('div');
    backHint.className = 'back-tap-hint';
    backHint.textContent = t('tapBack');
    cardBack.appendChild(backHint);

    cardBack.scrollTop = 0;
  }

  function createAudioBtn(text) {
    var btn = document.createElement('button');
    btn.className = 'audio-btn';
    btn.setAttribute('aria-label', 'Play pronunciation');
    btn.innerHTML = '<svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      speak(text);
    });
    return btn;
  }

  /* ================================
     Flip
     ================================ */
  function flipCard() {
    if (isFlipped) {
      flashcard.classList.remove('flipped');
      isFlipped = false;
    } else {
      renderBack();
      flashcard.classList.add('flipped');
      isFlipped = true;
    }
  }

  function closeCard() {
    if (isFlipped) {
      flashcard.classList.remove('flipped');
      isFlipped = false;
    }
  }

  /* ================================
     Transição entre cards
     ================================ */
  function transitionCard(direction, callback) {
    if (isTransitioning) return;
    isTransitioning = true;
    closeCard();

    var exitCls = direction === 'next' ? 'exit-left' : 'exit-right';
    var enterCls = direction === 'next' ? 'enter-right' : 'enter-left';

    function onExit() {
      cardScene.removeEventListener('animationend', onExit);
      cardScene.classList.remove(exitCls);
      callback();
      cardScene.classList.add(enterCls);
      function onEnter() {
        cardScene.removeEventListener('animationend', onEnter);
        cardScene.classList.remove(enterCls);
        isTransitioning = false;
      }
      cardScene.addEventListener('animationend', onEnter);
    }
    cardScene.classList.add(exitCls);
    cardScene.addEventListener('animationend', onExit);
  }

  /* ================================
     Navegação
     ================================ */
  function goNext() {
    var list = getList();
    if (!list.length) return;
    transitionCard('next', function() {
      currentIndex = (currentIndex + 1) % list.length;
      renderFront();
      updateProgress();
    });
  }

  function goPrev() {
    var list = getList();
    if (!list.length) return;
    transitionCard('prev', function() {
      currentIndex = (currentIndex - 1 + list.length) % list.length;
      renderFront();
      updateProgress();
    });
  }

  function doShuffle() {
    if (currentMode === 'heteronyms') {
      heteronymsList = shuffleArray(heteronymsList);
    } else {
      homophonesList = shuffleArray(homophonesList);
    }
    transitionCard('next', function() {
      currentIndex = 0;
      renderFront();
      updateProgress();
    });
  }

  /* ================================
     Mudança de modo
     ================================ */
  function switchMode(mode) {
    if (currentMode === mode) return;
    currentMode = mode;
    currentIndex = 0;
    applyModeColors();
    heteroTab.classList.toggle('active', mode === 'heteronyms');
    homoTab.classList.toggle('active', mode === 'homophones');
    transitionCard('next', function() {
      renderFront();
      updateProgress();
    });
  }

  /* ================================
     Mudança de idioma
     ================================ */
  function switchLang(newLang) {
    if (lang === newLang) return;
    lang = newLang;
    langBtns.forEach(function(b) { b.classList.toggle('active', b.dataset.lang === lang); });
    updateUI();
    if (isFlipped) renderBack();
  }

  /* ================================
     Síntese de voz
     ================================ */
  function speak(text) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    var utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'en-US';
    utt.rate = 0.92;
    var voices = speechSynthesis.getVoices();
    var keys = ['female','samantha','zira','karen','moira','fiona','tessa','veena','google us english'];
    var voice = null;
    for (var i = 0; i < voices.length; i++) {
      var n = voices[i].name.toLowerCase();
      if (voices[i].lang.startsWith('en') && keys.some(function(k) { return n.indexOf(k) !== -1; })) {
        voice = voices[i];
        break;
      }
    }
    if (voice) { utt.voice = voice; } else { utt.pitch = 1.3; }
    speechSynthesis.speak(utt);
  }

  (function loadVoices() {
    var v = speechSynthesis.getVoices();
    if (!v.length) speechSynthesis.onvoiceschanged = function() { speechSynthesis.getVoices(); };
  })();

  /* ================================
     Eventos
     ================================ */
  heteroTab.addEventListener('click', function() { switchMode('heteronyms'); });
  homoTab.addEventListener('click', function() { switchMode('homophones'); });

  flashcard.addEventListener('click', function(e) {
    if (e.target.closest('.audio-btn')) return;
    flipCard();
  });

  prevBtn.addEventListener('click', goPrev);
  nextBtn.addEventListener('click', goNext);
  shuffleBtn.addEventListener('click', doShuffle);

  langBtns.forEach(function(btn) {
    btn.addEventListener('click', function() { switchLang(btn.dataset.lang); });
  });

  window.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); goNext(); }
    else if (e.key === ' ') { e.preventDefault(); flipCard(); }
  });

  /* swipe */
  var touchX = 0, touchY = 0;
  flashcard.addEventListener('touchstart', function(e) {
    touchX = e.touches[0].clientX;
    touchY = e.touches[0].clientY;
  }, { passive: true });

  flashcard.addEventListener('touchend', function(e) {
    var dx = e.changedTouches[0].clientX - touchX;
    var dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
      if (dx < 0) goNext(); else goPrev();
    }
  }, { passive: true });

  /* ================================
     Init
     ================================ */
  applyModeColors();
  updateUI();

})();
</script>
</body>
</html>
